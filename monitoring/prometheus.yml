# Prometheus 全局配置 + 抓取任务
# ⚠️ 仅作参考（未生效）：当前环境由 kube-prometheus-stack（Helm + Operator）托管，
#    抓取目标通过 ServiceMonitor 声明、规则通过 PrometheusRule 声明，本文件不参与运行。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 集群节点指标
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # 集群状态指标
  - job_name: "kube-state-metrics"
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  # Pod 容器指标 (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # 业务服务 ai-svc 指标
  - job_name: "ai-svc"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ai-svc:8000"

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
