# Alertmanager 配置 — 告警路由到 AIOps Webhook
# 关键：把告警通过 webhook 推给 aiops-assistant (P3 智能分析入口)
route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - match:
        severity: critical
      receiver: aiops-critical
    - match:
        severity: warning
      receiver: aiops-warning

receivers:
  # 智能告警接收器 → 交付给 AIOps
  - name: aiops-critical
    webhook_configs:
      - url: "http://aiops-assistant.aiops/api/alert"
        send_resolved: true
  - name: aiops-warning
    webhook_configs:
      - url: "http://aiops-assistant.aiops/api/alert"
        send_resolved: true
