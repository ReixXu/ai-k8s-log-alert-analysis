# Promtail 日志采集（DaemonSet，每节点一个）
# 作用: 采集节点上所有 Pod 的容器日志，推送到 Loki
# 用法: kubectl apply -f promtail.yaml
# 说明: 用裸清单，采集规则透明可控

---
# 采集配置（scrape_configs）
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.monitoring:3100/loki/api/v1/push

    scrape_configs:
      # 采集所有 Pod 容器日志（static_configs + 通配符路径）
      # 注意: Promtail 3.x 不支持 file_targets(那是 Alloy 语法)，必须用 static_configs
      - job_name: kubernetes-pods
        static_configs:
          - targets: [localhost]
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        relabel_configs:
          # 从 /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log 提取 namespace
          - source_labels: [__path__]
            regex: '/var/log/pods/([^_]+)_(.+)_([0-9a-f-]+)/([^/]+)/.*'
            target_label: namespace
            replacement: '$1'
          # 提取 pod
          - source_labels: [__path__]
            regex: '/var/log/pods/([^_]+)_(.+)_([0-9a-f-]+)/([^/]+)/.*'
            target_label: pod
            replacement: '$2'
          # 提取 container
          - source_labels: [__path__]
            regex: '/var/log/pods/([^_]+)_(.+)_([0-9a-f-]+)/([^/]+)/.*'
            target_label: container
            replacement: '$4'

---
# ServiceAccount + RBAC（Promtail 需要读取 Pod 元数据）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring

---
# DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
              name: http-metrics
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: podlogs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      tolerations:
        - operator: Exists   # 容忍所有污点，确保每个节点都采集
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: podlogs
          hostPath:
            path: /var/log/pods
